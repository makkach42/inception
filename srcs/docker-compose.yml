services:
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    ports:
      - "80:80"
  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      device: /home/makkach/data
      o: bind

