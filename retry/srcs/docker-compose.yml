services:
  nginx:
    image: nginx
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - 443:443
    env_file:
      - ./.env
    networks:
      - inception
    volumes:
      - wordpress_vol:/wordpress
    depends_on:
      wordpress:
       condition: service_started

  mariadb:
    image: mariadb
    container_name: mariadb
    build: ./requirements/mariadb
    secrets:
      - DB_USER_PASSWORD
    env_file:
      - ./.env
    networks:
      - inception
    volumes:
      - mariadb_vol:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb" , "-u", "root", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  wordpress:
    image: wordpress
    container_name: wordpress
    build: ./requirements/wordpress
    env_file:
      - ./.env
    networks:
      - inception
    volumes:
      - wordpress_vol:/wordpress
    secrets:
      - WP_PASSWORD
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  inception:

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      device: /home/makkach/data/mariadb
      o: bind
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      device: /home/makkach/data/wordpress
      o: bind
    
secrets:
  DB_USER_PASSWORD: 
    file: ../secrets/DB_USER_PASSWORD
  WP_PASSWORD:
    file: ../secrets/WP_PASSWORD
